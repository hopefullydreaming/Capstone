<p>classes</p>
<table>
  <tr>
    <th>Name</th>
    <th>Description</th>
    <th>Subclass Level</th>
  </tr>

  @for(class of classes(); track class.row_id){
  <tr>
    <td>{{class.name}}</td>
    <td>{{class.description}}</td>
    <td>{{class.subclass_level}}</td>
  </tr>
  }
  @empty{
    <tr>
      <td colspan="3">NOTHING</td>
    </tr>
  }
</table>
