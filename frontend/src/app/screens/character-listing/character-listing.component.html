<div class="p-4 flex flex-col gap-3">
    <p class="text-xl">Your Characters</p>
    <div class="grid grid-cols-[repeat(auto-fill,minmax(200px,1fr))] gap-3">

        <div class="flex flex-col items-center p-5 border border-purple-700 justify-between" (click)="addCharacter()">
            <i class="text-purple-600 pi pi-plus p-2 text-2xl!"></i>
            <p>Add New</p>
        </div>


        @for(char of characters(); track char.row_id;){
        <div class="flex flex-col items-center p-5 pt-3 border border-purple-700">
            <div class="text-purple-600 underline cursor-pointer py-2 px-4 hover:text-purple-800" (click)="clickCharacter(char.row_id)">{{char.name}}</div>
            <div>Level {{char.level}} {{char.class_name}}</div>
            <div>{{ char.subspecies_name != null ? char.subspecies_name : char.species_name }}</div>
            <div class="flex flex-row gap-10 text-purple-600 underline cursor-pointer">
                @if(char.level < 20){
                <div class="hover:text-purple-800" (click)="levelUp(char.row_id, char)">Level Up</div>
                }
                @else{
                <div class="text-purple-400">Max Level</div>
                }
                <div class="hover:text-purple-800">Delete</div>
            </div>
        </div>
        }

    </div>

</div>
