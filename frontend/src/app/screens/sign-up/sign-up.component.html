<div class="p-4 flex flex-col gap-4">

    <form [formGroup]="form" (ngSubmit)="submit()" class="flex flex-col gap-4 items-center mt-6">
        <div class="flex flex-col gap-1">
            <label for="email">Email:</label>
            <input pInputText pSize="small"
                   class="w-full sm:w-96" id="email"
                   placeholder="Enter your email"
                   formControlName="email"
                   required />
        </div>
        <div class="flex flex-col gap-1">
            <label for="username">Username:</label>
            <input pInputText pSize="small"
                   class="w-full sm:w-96" id="username"
                   placeholder="Enter a username"
                   formControlName="username"
                   required />
        </div>
        <div class="flex flex-col gap-1">
            <label for="password">Password:</label>
            <input type="text" pInputText pSize="small"
                   class="w-full sm:w-96" id="password"
                   placeholder="Enter your password"
                   formControlName="password"
                   required />
        </div>
        <!--<div class="text-red-400">{{ errorMsg() }}</div>-->
        <button pButton pSize="small" type="submit" class=" w-fit">Sign Up</button>

    </form>
    <div class="flex flex-col text-center">
        <p>Already have an account? <span (click)="goToLogin()" class="cursor-pointer text-purple-600 underline w-fit hover:text-purple-800">Login</span></p>
    </div>
</div>
